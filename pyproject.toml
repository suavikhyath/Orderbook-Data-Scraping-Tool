[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-vault"
version = "0.1.0"
description = "Delta Exchange India market data fetching and cleaning"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]